<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nathan Lyons — Database Engineer // NL-OS</title>
<meta name="description" content="Interactive terminal CV of Nathan Lyons — database engineer and developer based in Cork, Ireland.">
<meta name="theme-color" content="#050607">
<script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Michroma&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
/* =========================================================
   NL-OS — palette + type lifted from "Cyberpunk HUD V2"
   (City of the Dark Future vault). 2018 demo HUD:
   red banners, grey record frames, mint readouts, scanlines.
   ========================================================= */
:root{
  --red:#ff1f4b; --red-soft:#ff4d6d; --red-dim:#7a1428; --red-glow:rgba(255,31,75,.55);
  --mint:#a9f2e6; --mint-dim:#5f9e95; --mint-glow:rgba(169,242,230,.45);
  --bg-0:#050607; --bg-1:#0b0d0e; --bg-2:#111415; --bg-3:#181c1d;
  --frame:#8f9898; --frame-dim:#3c4444;
  --label:#c4cccc; --value:#e8eded; --muted:#7d8787; --faint:#4a5252;
  --ink-on-red:#120206;

  --f-label:"Michroma","Eurostile","Bank Gothic",sans-serif;
  --f-text:"Rajdhani","Bahnschrift",sans-serif;
  --f-mono:"Share Tech Mono",ui-monospace,Menlo,Consolas,monospace;

  --barcode:
    repeating-linear-gradient(90deg,
      var(--red) 0 4px, transparent 4px 6px, var(--red) 6px 7px,
      transparent 7px 10px, var(--red) 10px 16px, transparent 16px 17px,
      var(--red) 17px 18px, transparent 18px 23px),
    repeating-linear-gradient(90deg,
      transparent 0 9px, var(--red) 9px 12px, transparent 12px 31px,
      var(--red) 31px 33px, transparent 33px 37px);
  --segbar:
    linear-gradient(90deg,
      var(--mint) 0 9%, transparent 9% 10.5%,
      var(--mint) 10.5% 24%, transparent 24% 24.6%,
      var(--mint) 24.6% 25.4%, transparent 25.4% 26%,
      var(--mint) 26% 38%, transparent 38% 38.8%,
      var(--mint) 38.8% 82%, transparent 82%) left / 100% 100% no-repeat,
    repeating-linear-gradient(90deg,
      var(--mint) 0 2px, transparent 2px 3px, var(--mint) 3px 6px, transparent 6px 8px) right / 15% 100% no-repeat;

  --fs: clamp(14px, .4vw + 10px, 16px);
  --hud-w: 340px;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; color:var(--value); font:var(--fs)/1.55 var(--f-mono);
  background:
    radial-gradient(900px 520px at 100% 0%, rgba(255,31,75,.07), transparent 70%),
    radial-gradient(700px 420px at 0% 100%, rgba(169,242,230,.035), transparent 70%),
    var(--bg-1);
  overflow:hidden; -webkit-font-smoothing:antialiased;
}
::selection{ background:rgba(255,31,75,.35); color:#fff }
a{color:inherit}
::-webkit-scrollbar{ width:5px; height:5px }
::-webkit-scrollbar-track{ background:transparent }
::-webkit-scrollbar-thumb{ background:var(--frame-dim) }
::-webkit-scrollbar-thumb:hover{ background:var(--red) }

/* ── scanlines + CRT ─────────────────────────────────── */
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:60;
  background:repeating-linear-gradient(0deg, rgba(0,0,0,.22) 0 1px, transparent 1px 3px);
  animation:flick 5s steps(1) infinite;
}
body::after{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:61;
  background:radial-gradient(ellipse at center, transparent 58%, rgba(0,0,0,.6) 100%);
}
@keyframes flick{ 0%,100%{opacity:1} 47%{opacity:.82} 48%{opacity:1} 83%{opacity:.9} 84%{opacity:1} }
.scanbar{
  position:fixed; left:0; right:0; top:-140px; height:140px; z-index:62; pointer-events:none;
  background:linear-gradient(to bottom, transparent, rgba(255,31,75,.045) 60%, rgba(255,255,255,.035) 62%, transparent);
  animation:roll 8s linear infinite;
}
@keyframes roll{ to{ transform:translateY(calc(100dvh + 280px)) } }

/* ── shell ───────────────────────────────────────────── */
.shell{ display:grid; grid-template-rows:auto minmax(0,1fr) auto; grid-template-columns:minmax(0,1fr); height:100dvh }

.topbar{
  position:relative; display:flex; align-items:center; gap:14px; height:46px; padding:0 16px;
  background:var(--bg-0); border-bottom:1px solid var(--frame-dim); min-width:0;
}
.topbar::after{ content:""; position:absolute; left:12px; right:12px; bottom:-1px; height:3px; background:var(--segbar); opacity:.85; pointer-events:none }
.topbar > *{ flex-shrink:0 }
.logo{ font:400 13px/1 var(--f-label); letter-spacing:.14em; color:var(--red); text-shadow:0 0 12px var(--red-glow) }
.logo b{ color:var(--value); font-weight:400 }
.tabs{ display:flex; gap:4px; margin-left:10px }
.tab{
  font:400 9.5px/1 var(--f-label); letter-spacing:.14em; text-transform:uppercase; color:var(--muted);
  background:transparent; border:1px solid transparent; padding:8px 12px; cursor:pointer;
}
.tab:hover, .tab:focus-visible{ color:var(--value); border-color:var(--frame-dim); outline:none }
.tab.on{ color:var(--red); border-color:var(--red); background:var(--bg-1); box-shadow:0 0 10px var(--red-glow); cursor:default }
.topbar .spacer{ flex:1 }
.readout{ font:12px/1 var(--f-mono); letter-spacing:.1em; text-transform:uppercase; color:var(--red) }
.readout.dim{ color:var(--muted) }

.main{ display:grid; grid-template-columns:minmax(0,1fr) var(--hud-w); min-height:0 }

/* ── terminal ────────────────────────────────────────── */
.term{
  container:term / inline-size; overflow-y:auto; overscroll-behavior:contain;
  padding:22px 30px 30px; min-height:0; cursor:text; scrollbar-width:thin; scrollbar-color:var(--frame-dim) transparent;
}
.ln{ white-space:pre-wrap; overflow-wrap:anywhere; min-height:1.55em }
.ln.in{ animation:lnIn .16s ease-out both }
@keyframes lnIn{ from{opacity:0; transform:translateX(-5px)} to{opacity:1; transform:none} }
.ln.in .rec, .ln.in .opts, .ln.in .fgrid{ animation:wipe .32s steps(7) both }
@keyframes wipe{ from{ clip-path:inset(0 0 100% 0) } to{ clip-path:inset(0 0 0 0) } }

.ps1{ white-space:nowrap; color:var(--faint) }
.ps1 .u{ color:var(--red) } .ps1 .hst{ color:var(--label) } .ps1 .cwd{ color:var(--mint) }
.echo{ margin-top:.35em }
.echo .typed{ color:var(--value) }
.prompt-line{ display:flex; align-items:baseline; gap:1ch; margin-top:.35em }
#cmd{
  flex:1; min-width:0; background:transparent; border:0; outline:0; padding:0; margin:0;
  font:inherit; color:var(--value); caret-color:var(--red); caret-shape:block;
}
#cmd::placeholder{ color:var(--faint) }

/* red quest banner ("BREAKING THROUGH") */
.hb{
  display:inline-block; margin:.75em 0 .8em; padding:.5em .85em .42em;
  font:400 .9em/1 var(--f-label); letter-spacing:.14em; text-transform:uppercase;
  background:var(--red); color:var(--ink-on-red); -webkit-text-stroke:.5px var(--ink-on-red);
  transform:rotate(-1.2deg); transform-origin:left center; box-shadow:0 0 22px var(--red-glow);
}
.hb.alt{ background:var(--mint); box-shadow:0 0 22px var(--mint-glow) }
/* wide-spaced label with long rule ("BACKSTORY") */
.lbl{
  display:block; max-width:92ch; padding-bottom:.55em; margin:.4em 0 .5em; border-bottom:1px solid var(--frame-dim);
  font:400 .66em/1.2 var(--f-label); letter-spacing:.16em; text-transform:uppercase; color:var(--label);
}
.lbl.red{ color:var(--red) }

.m{ color:var(--label) } .d{ color:var(--muted) } .f{ color:var(--faint) }
.ok{ color:var(--mint) } .red{ color:var(--red) } .mint{ color:var(--mint) }
.err{ color:var(--red-soft) }
.errtag{ background:var(--red); color:var(--ink-on-red); padding:.1em .6em; font:400 .62em/1 var(--f-label); letter-spacing:.14em; vertical-align:.15em }
.draft{ display:inline-block; margin-left:.8em; border:1px solid var(--red); color:var(--red); padding:.15em .6em; font:400 .85em/1 var(--f-label); letter-spacing:.14em; box-shadow:0 0 8px var(--red-glow) }
.k{ display:inline-block; min-width:10ch; color:var(--muted); text-transform:uppercase; letter-spacing:.08em }

button.c, a.c{
  font:inherit; color:var(--red-soft); background:none; border:0; padding:0 .1em; cursor:pointer;
  text-decoration:none; border-bottom:1px solid var(--red-dim);
}
button.c:hover, button.c:focus-visible, a.c:hover, a.c:focus-visible{
  background:var(--red); color:var(--ink-on-red); border-color:var(--red); outline:none; box-shadow:0 0 10px var(--red-glow);
}
a.c.ext{ color:var(--mint); border-bottom-color:var(--mint-dim) }
a.c.ext:hover, a.c.ext:focus-visible{ background:var(--mint); color:var(--bg-0); border-color:var(--mint); box-shadow:0 0 10px var(--mint-glow) }

/* ── record panels (character-creator cards) ─────────── */
.rec, .opts, .fgrid{ white-space:normal }
.rec{
  position:relative; max-width:92ch; margin:.3em 0 .9em; padding:.75em 1.05em .95em;
  border:1px solid var(--frame); background:rgba(5,6,7,.6);
  font:500 1.12em/1.45 var(--f-text); letter-spacing:.015em;
}
.rec-l{
  display:flex; justify-content:space-between; gap:1em; margin-bottom:.7em;
  font:400 .56rem/1.3 var(--f-label); letter-spacing:.14em; text-transform:uppercase; color:var(--label);
}
.rec-l span:last-child{ color:var(--muted); text-align:right; white-space:nowrap; flex-shrink:0 }
.rec.sel{ border:2px solid var(--red); padding-bottom:2.3em; box-shadow:0 0 14px var(--red-glow), inset 0 0 18px rgba(255,31,75,.12) }
.rec.sel > .rec-l span:first-child{ color:var(--red); text-shadow:0 0 8px var(--red-glow) }
.rec.sel::after, .panel.sel::after, .opt::after{
  content:""; position:absolute; left:6px; right:6px; bottom:6px; height:14px;
  background:var(--barcode); filter:drop-shadow(0 0 4px var(--red-glow));
}
.rec p{ margin:0 0 .6em } .rec p:last-child{ margin-bottom:0 }
.rec-t{ font:700 1.3em/1.1 var(--f-text); letter-spacing:.05em; text-transform:uppercase; color:#fff }
.rec-s{ color:var(--muted); margin-top:.15em }
.rec ul{ margin:.65em 0 0; padding-left:1.15em }
.rec li{ list-style:square; margin:.18em 0 } .rec li::marker{ color:var(--red) }

/* form grid (label above value) */
.fgrid{
  display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 22ch), 1fr));
  max-width:92ch; margin:.3em 0 .9em; border-top:1px solid var(--frame); border-left:1px solid var(--frame);
  font:500 1.08em/1.4 var(--f-text);
}
.rec .fgrid{ margin:.8em 0 0; font-size:1em }
.cell{ padding:.5em .9em .6em; border-right:1px solid var(--frame); border-bottom:1px solid var(--frame); min-width:0 }
.cell.wide{ grid-column:1 / -1 }
.fl{ display:block; margin-bottom:.35em; font:400 .52rem/1.3 var(--f-label); letter-spacing:.14em; text-transform:uppercase; color:var(--label) }
.fv{ display:block; color:var(--value); overflow-wrap:anywhere }
.cell:hover{ background:rgba(255,31,75,.05) }

.chip{
  display:inline-block; margin:0 .35em .4em 0; padding:.35em .75em .3em; border:1px solid var(--frame);
  font:400 .55rem/1.2 var(--f-label); letter-spacing:.12em; text-transform:uppercase; color:var(--label);
  transition:border-color .12s, color .12s, background .12s;
}
.chip:hover{ border-color:var(--red); color:var(--red); background:rgba(255,31,75,.08) }

/* option boxes (selectable records) */
.opts{ display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 26ch), 1fr)); gap:10px; max-width:92ch; margin:.4em 0 .8em }
.opt{
  position:relative; display:block; text-align:left; cursor:pointer; color:var(--value);
  background:rgba(5,6,7,.6); border:1px solid var(--frame); padding:.75em 1em 2.3em;
  font:500 1.1em/1.35 var(--f-text); transition:border-color .12s, box-shadow .12s;
}
.opt .rec-l{ margin-bottom:.55em }
.opt-t{ display:block; font-weight:700; font-size:1.15em; letter-spacing:.05em; text-transform:uppercase; color:#fff }
.opt-s{ display:block; color:var(--muted); margin-top:.15em }
.opt::after{ opacity:0; transition:opacity .15s }
.opt:hover, .opt:focus-visible{ outline:none; border-color:var(--red); box-shadow:0 0 14px var(--red-glow), inset 0 0 18px rgba(255,31,75,.12) }
.opt:hover::after, .opt:focus-visible::after{ opacity:1 }
.opt:hover .opt-t, .opt:focus-visible .opt-t{ color:var(--red); text-shadow:0 0 8px var(--red-glow) }

/* ascii banner */
.banner{
  margin:6px 0 0; line-height:1.04; white-space:pre; overflow:hidden; color:var(--red);
  font-family:"Menlo","SF Mono",ui-monospace,monospace;  /* box-drawing glyphs need a full mono */
  text-shadow:0 0 12px var(--red-glow), -2px 0 0 rgba(169,242,230,.28);
}
.banner.lg{ font-size:min(14px, 100cqw / 60) }
.banner.sm{ display:none; font-size:min(14px, 100cqw / 36) }
.banner-txt{ display:none; font:400 22px/1.15 var(--f-label); color:var(--red); letter-spacing:.1em; text-shadow:0 0 12px var(--red-glow) }
@container term (max-width: 760px){ .banner.lg{display:none} .banner.sm{display:block} }
@container term (max-width: 330px){ .banner.sm{display:none} .banner-txt.glitch{display:inline-block} }
.segbar{ display:block; height:4px; max-width:min(100%, 98ch); background:var(--segbar); opacity:.85; margin:10px 0 14px }
.tagline{ font:600 1.15em/1.3 var(--f-text); letter-spacing:.12em; text-transform:uppercase }

.bar{ color:var(--red); text-shadow:0 0 6px var(--red-glow) }

/* sql result tables */
.sqlwrap{ white-space:normal; overflow-x:auto; max-width:100%; margin:.35em 0 .3em; scrollbar-width:thin; scrollbar-color:var(--frame-dim) transparent }
.sqlt{ border-collapse:collapse; border:1px solid var(--frame); background:rgba(5,6,7,.6); font:500 1.02em/1.35 var(--f-text) }
.sqlt th{ font:400 .52rem/1.3 var(--f-label); letter-spacing:.14em; text-transform:uppercase; color:var(--label); text-align:left; padding:.7em .85em .6em; border:1px solid var(--frame); white-space:nowrap }
.sqlt td{ padding:.35em .85em; border:1px solid var(--frame-dim); color:var(--value); vertical-align:top; max-width:60ch }
.sqlt td{ min-width:14ch }
.sqlt td.num{ color:var(--mint); text-align:right; font-family:var(--f-mono); white-space:nowrap; min-width:0 }
.sqlt tr:hover td{ background:rgba(255,31,75,.07) }
.ln.in .sqlwrap{ animation:wipe .32s steps(7) both }
.schema{ color:var(--mint); opacity:.9 }
.ps1 .db{ color:var(--mint) } .ps1 .sq{ color:var(--red); text-shadow:0 0 8px var(--red-glow) }

/* git log */
.glog{ display:grid; grid-template-columns:auto auto auto minmax(0,1fr); column-gap:2ch; white-space:normal; max-width:110ch }
.glog > span{ white-space:nowrap } .glog > span.msg{ white-space:normal; color:var(--value) }
@container term (max-width: 620px){
  .glog{ grid-template-columns:auto auto minmax(0,1fr) }
  .glog > span.msg{ grid-column:1 / -1; margin-bottom:.55em; color:var(--label) }
  .glog > span:nth-child(4n+3){ overflow:hidden; text-overflow:ellipsis }
} .bar .e{ color:var(--frame-dim); text-shadow:none }

/* glitch */
.glitch{ position:relative }
span.glitch, div.glitch{ display:inline-block }
.banner-txt.glitch{ display:none }
.glitch::before,.glitch::after{ content:attr(data-text); position:absolute; inset:0; opacity:0; pointer-events:none; padding:inherit }
.glitch::before{ color:var(--mint); animation:gl1 6.5s infinite steps(1) }
.glitch::after { color:var(--red);  animation:gl2 6.5s infinite steps(1) }
@keyframes gl1{
  0%,90%,100%{opacity:0; transform:none}
  91%{opacity:.9; transform:translate(-3px,1px); clip-path:inset(12% 0 55% 0)}
  93%{opacity:.9; transform:translate(4px,-1px); clip-path:inset(62% 0 6% 0)}
  95%{opacity:.9; transform:translate(-2px,0);   clip-path:inset(32% 0 38% 0)}
  96%{opacity:0}
}
@keyframes gl2{
  0%,91%,100%{opacity:0; transform:none}
  92%{opacity:.85; transform:translate(3px,0);    clip-path:inset(48% 0 22% 0)}
  94%{opacity:.85; transform:translate(-4px,1px); clip-path:inset(4% 0 74% 0)}
  96%{opacity:0}
}
.glitch.now::before{ animation:gl1 .5s steps(1) 1 } .glitch.now::after{ animation:gl2 .5s steps(1) 1 }
.hb.glitch::before{ color:var(--ink-on-red) } .hb.glitch::after{ color:#fff }

/* ── HUD sidebar ─────────────────────────────────────── */
.hud{
  border-left:1px solid var(--frame-dim); background:rgba(5,6,7,.55);
  overflow-y:auto; padding:18px 16px 24px; min-height:0; display:flex; flex-direction:column; gap:14px;
  scrollbar-width:thin; scrollbar-color:var(--frame-dim) transparent;
}
.panel{ position:relative; border:1px solid var(--frame); padding:12px 14px 14px; background:rgba(11,13,14,.75) }
.panel.sel{ border:2px solid var(--red); padding-bottom:34px; box-shadow:0 0 14px var(--red-glow), inset 0 0 18px rgba(255,31,75,.12) }
.plabel{
  display:flex; justify-content:space-between; margin-bottom:12px;
  font:400 9px/1.2 var(--f-label); letter-spacing:.14em; text-transform:uppercase; color:var(--label);
}
.plabel span:last-child{ color:var(--muted) }
.panel.sel .plabel span:first-child{ color:var(--red); text-shadow:0 0 8px var(--red-glow) }
.ident-name{ font:400 18px/1.15 var(--f-label); letter-spacing:.08em; text-transform:uppercase; color:#fff }
.ident-role{ margin-top:8px; font:700 15px/1.2 var(--f-text); letter-spacing:.12em; text-transform:uppercase; color:var(--red); text-shadow:0 0 10px var(--red-glow) }
.hud .fgrid{ margin:12px 0 0; font-size:15px; grid-template-columns:1fr 1fr }
.hud .cell{ padding:.45em .7em .5em }
.pulse{ display:inline-block; width:7px; height:7px; background:var(--mint); margin-right:7px; box-shadow:0 0 8px var(--mint); animation:pulse 1.6s ease-in-out infinite; vertical-align:1px }
@keyframes pulse{ 50%{opacity:.3} }

.qcmds{ display:grid; grid-template-columns:1fr 1fr; gap:6px }
.qbtn{
  display:flex; align-items:center; gap:8px; min-height:38px; padding:9px 10px; cursor:pointer; text-align:left;
  background:transparent; border:1px solid var(--frame-dim); color:var(--label);
  font:400 9px/1.2 var(--f-label); letter-spacing:.12em; text-transform:uppercase;
  transition:background .1s, color .1s, border-color .1s, box-shadow .1s;
}
.qbtn i{ font:normal 11px/1 var(--f-mono); color:var(--faint) }
.qbtn.on{ border-color:var(--red); color:var(--red); box-shadow:0 0 10px var(--red-glow); background:var(--bg-1) }
.qbtn:hover, .qbtn:focus-visible{ background:var(--red); color:var(--ink-on-red); border-color:var(--red); outline:none; box-shadow:0 0 12px var(--red-glow) }
.qbtn:hover i, .qbtn:focus-visible i{ color:var(--ink-on-red) }
.qbtn.wide{ grid-column:1 / -1; justify-content:space-between }

.links{ display:flex; flex-direction:column; font:600 15px/1.2 var(--f-text); letter-spacing:.03em }
.links a{ display:flex; justify-content:space-between; gap:10px; padding:8px 0; text-decoration:none; border-bottom:1px dashed var(--frame-dim); color:var(--value) }
.links a span:first-child{ font:400 9px/1.6 var(--f-label); letter-spacing:.14em; text-transform:uppercase; color:var(--label) }
.links a span:last-child{ color:var(--mint); overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.links a:hover span:first-child, .links a:focus-visible span:first-child{ color:var(--red) }
.links a:focus-visible{ outline:1px solid var(--red); outline-offset:2px }

.sys{ display:grid; grid-template-columns:auto 1fr; gap:4px 12px; font:13px/1.5 var(--f-mono) }
.sys span:nth-child(odd){ font:400 8.5px/2.2 var(--f-label); letter-spacing:.14em; text-transform:uppercase; color:var(--muted) }
.sys span:nth-child(even){ text-align:right; font-variant-numeric:tabular-nums; color:var(--value) }
.sys .red{ color:var(--red) !important } .sys .mint{ color:var(--mint) !important }

/* ── status bar ("PROTOCOL 6520-A44") ─────────────────── */
.statusbar{
  display:flex; align-items:stretch; height:30px; background:var(--bg-0); border-top:1px solid var(--frame-dim);
  font:12px/1 var(--f-mono); letter-spacing:.1em; text-transform:uppercase; color:var(--red);
}
.seg{ display:flex; align-items:center; padding:0 14px; border-right:1px solid var(--frame-dim); white-space:nowrap }
.seg.mode{ background:var(--red); color:var(--ink-on-red); font:400 9.5px/1 var(--f-label); letter-spacing:.16em; box-shadow:0 0 12px var(--red-glow) }
.seg.mode.busy{ background:var(--mint); box-shadow:0 0 12px var(--mint-glow) }
.seg.cwd{ color:var(--mint); text-transform:none }
.ticker{ flex:1; overflow:hidden; display:flex; align-items:center; mask-image:linear-gradient(90deg, transparent, #000 5%, #000 95%, transparent) }
.ticker .track{ display:inline-flex; white-space:nowrap; padding-left:14px; animation:tick 70s linear infinite; color:var(--red-soft) }
.ticker .track span{ padding-right:4em } .ticker .track b{ color:var(--value); font-weight:400 }
@keyframes tick{ to{ transform:translateX(-50%) } }
.seg.clock{ border-right:0; border-left:1px solid var(--frame-dim); color:var(--value); font-variant-numeric:tabular-nums }

.chips{ display:none }

@media (max-width: 900px){
  :root{ --fs:14px }
  .main{ grid-template-columns:minmax(0,1fr) }
  .hud{ display:none }
  .term{ padding:16px 16px 20px }
  .chips{ display:flex; gap:6px; overflow-x:auto; padding:8px 12px; background:var(--bg-0); border-top:1px solid var(--frame-dim); scrollbar-width:none }
  .chips .qbtn{ flex:none; min-height:42px }
  .shell{ grid-template-rows:auto minmax(0,1fr) auto auto }
  .tabs, .readout.dim{ display:none }
  .seg.cwd, .ticker{ display:none }
  .statusbar{ justify-content:space-between }
  #cmd{ font-size:16px }
}

@media (prefers-reduced-motion: reduce){
  body::before, .ticker .track, .pulse{ animation:none }
  .scanbar, .glitch::before, .glitch::after{ display:none }
  .ln.in, .ln.in .rec, .ln.in .opts, .ln.in .fgrid{ animation:none }
}
html[data-motion="off"] body::before, html[data-motion="off"] .ticker .track{ animation:none }
html[data-motion="off"] .scanbar, html[data-motion="off"] .glitch::before, html[data-motion="off"] .glitch::after{ display:none }
html[data-motion="off"] .ln.in, html[data-motion="off"] .ln.in .rec, html[data-motion="off"] .ln.in .opts, html[data-motion="off"] .ln.in .fgrid{ animation:none }
html[data-scan="off"] body::before, html[data-scan="off"] .scanbar{ display:none }

/* ── print: clean paper CV ───────────────────────────── */
#print-cv{ display:none }
@media print{
  @page{ margin:15mm 16mm }
  body{ background:#fff; color:#111; overflow:visible; font:500 11pt/1.4 "Rajdhani", "Bahnschrift", sans-serif }
  body::before, body::after, .scanbar, .shell{ display:none !important }
  #print-cv{ display:block }
  #print-cv h1{ font:400 20pt/1 "Michroma", sans-serif; letter-spacing:.06em; text-transform:uppercase; margin:0 0 6pt }
  #print-cv .sub{ color:#444; margin-bottom:8pt }
  #print-cv h2{ font:400 8.5pt/1 "Michroma", sans-serif; letter-spacing:.2em; text-transform:uppercase;
    border-bottom:1.2pt solid #111; padding-bottom:4pt; margin:13pt 0 5pt; break-after:avoid }
  #print-cv .entry{ break-inside:avoid }
  #print-cv .row{ display:flex; justify-content:space-between; gap:12pt; font-weight:700; margin-top:6pt; text-transform:uppercase; letter-spacing:.03em }
  #print-cv .row span:last-child{ font-weight:500; color:#555; white-space:nowrap }
  #print-cv ul{ margin:2pt 0 0; padding-left:13pt } #print-cv li{ margin:1pt 0; list-style:square }
  #print-cv .meta{ color:#555; font-weight:500; text-transform:none; letter-spacing:0 }
  #print-cv a{ color:#111; text-decoration:none }
}

/* ═══════════════════════════ engine ═══════════════════════════ */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const root = document.documentElement;
const out = $("#out"), input = $("#cmd"), term = $("#term");
const reducedPref = matchMedia("(prefers-reduced-motion: reduce)").matches;
const finePointer = matchMedia("(pointer: fine)").matches;
const started = Date.now();
const store = { get:(k,d)=>{ try{ return localStorage.getItem(k) ?? d }catch{ return d } }, set:(k,v)=>{ try{ localStorage.setItem(k,v) }catch{} } };

let motion = !reducedPref && store.get("nl-motion", "on") !== "off";
root.dataset.motion = motion ? "on" : "off";
root.dataset.scan = store.get("nl-scan", "on");

let cwd = "~", flushing = false, busy = false, runCount = 0, sqlMode = false;
let hist = []; try { hist = JSON.parse(store.get("nl-hist", "[]")) || []; } catch {}
let hIdx = hist.length;
let chain = Promise.resolve();

/* html builders */
const pad2 = n => String(n).padStart(2, "0");
const c    = (cmd, label) => `<button class="c" data-cmd="${esc(cmd)}">${esc(label ?? cmd)}</button>`;
const ext  = (url, label) => `<a class="c ext" href="${esc(url)}" target="_blank" rel="noopener">${esc(label)}</a>`;
const h    = (t, cls = "") => `<span class="hb ${cls}" data-scramble>${esc(t)}</span>`;
const lbl  = (t, cls = "") => `<span class="lbl ${cls}">${t}</span>`;
const kv   = (k, v) => `<span class="k">${esc(k)}</span>${v}`;
const ul   = arr => `<ul>${arr.map(x => `<li>${x}</li>`).join("")}</ul>`;
const chips = arr => arr.map(s => `<span class="chip">${esc(s)}</span>`).join("");
const draft = d => d ? `<span class="draft">draft</span>` : "";
const cells = list => list.map(([l, v, w]) => `<div class="cell${w ? " wide" : ""}"><span class="fl">${esc(l)}</span><span class="fv">${v}</span></div>`).join("");
const fgrid = list => `<div class="fgrid">${cells(list)}</div>`;
const rec = ({ label, right = "", sel = false, body }) =>
  `<div class="rec${sel ? " sel" : ""}"><div class="rec-l"><span>${label}</span><span>${right}</span></div>${body}</div>`;
const pad = (s, n) => esc(s) + " ".repeat(Math.max(1, n - s.length));

function sleep(ms){ return (flushing || !motion) ? Promise.resolve() : new Promise(r => setTimeout(r, ms)); }
function scrollEnd(){ term.scrollTop = term.scrollHeight; }

async function emit(lines, delay = 16){
  for (const l of [].concat(lines)){
    const div = document.createElement("div");
    div.className = "ln" + (motion && !flushing && !document.hidden ? " in" : "");
    div.innerHTML = l === "" ? "&nbsp;" : l;
    out.appendChild(div);
    div.querySelectorAll("[data-scramble]").forEach(scramble);
    scrollEnd();
    await sleep(delay);
  }
}

const GLYPHS = "!<>-_\\/[]{}=+*^?#$%&01ABCDEFXZ";
function scramble(el){
  if (!motion || flushing) return;
  const final = el.textContent; let f = 0;
  const iv = setInterval(() => {
    let s = "";
    for (let i = 0; i < final.length; i++) s += (i < f * 2 || final[i] === " ") ? final[i] : GLYPHS[(Math.random() * GLYPHS.length) | 0];
    el.textContent = s;
    if (++f * 2 >= final.length){ clearInterval(iv); el.textContent = final; }
  }, 24);
}

function ps1Html(){
  if (sqlMode) return `<span class="db">cv.db</span> <span class="sq">sql&gt;</span>`;
  return `<span class="u">nathan</span>@<span class="hst">nl-os</span>:<span class="cwd">${esc(cwd)}</span>$`;
}
function renderPs1(){ $("#ps1").innerHTML = ps1Html(); $("#cwdSeg").textContent = sqlMode ? "cv.db" : cwd; input.placeholder = sqlMode ? "SELECT * FROM projects;" : "type help"; setBusy(busy); }
function echoLine(text){
  const div = document.createElement("div");
  div.className = "ln echo";
  div.innerHTML = `<span class="ps1">${ps1Html()}</span> <span class="typed">${esc(text)}</span>`;
  out.appendChild(div); scrollEnd();
}
function setBusy(b){ busy = b; const m = $("#mode"); m.textContent = b ? "busy" : (sqlMode ? "sql" : "ready"); m.classList.toggle("busy", b); }
function markActive(key){ document.querySelectorAll(".qbtn").forEach(b => b.classList.toggle("on", b.dataset.cmd.split(" ")[0] === key)); }

function exec(raw, opts){ chain = chain.then(() => run(raw, opts)).catch(console.error); return chain; }

async function run(raw, { echo = true, record = true } = {}){
  const line = raw.trim();
  if (echo) echoLine(line);
  if (!line) return;
  if (record){ hist.push(line); hist = hist.slice(-50); store.set("nl-hist", JSON.stringify(hist)); }
  hIdx = hist.length;
  const [name, ...args] = line.split(/\s+/);
  const key = ALIASES[name.toLowerCase()] || name.toLowerCase();
  const cmd = COMMANDS[key];
  setBusy(true);
  try {
    if (sqlMode && key === "exit") await leaveSql();
    else if (sqlMode && !cmd) await sqlInput(line);
    else if (!cmd) await emit([`<span class="errtag">err</span> <span class="err">command not found:</span> ${esc(name)}`, `type ${c("help")} to see what this terminal can do`, ""]);
    else {
      if (cmd.group === "cv") markActive(key);
      if (sqlMode && key !== "sql" && !SQL_KEEP.has(key)) await leaveSql();
      await cmd.run(args, line);
      runCount++; $("#sysCount").textContent = runCount;
    }
  } finally { setBusy(false); flushing = false; }
}

/* ───────── virtual filesystem ───────── */
const FS = {
  "~":            ["about.txt", "experience/", "projects/", "education.log", "skills.cfg", "interests.txt", "contact.vcf"],
  "~/projects":   CV.projects.map(p => p.id + ".md"),
  "~/experience": CV.experience.map((e, i) => `${pad2(i + 1)}-${e.org.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "")}.log`),
};
const FILE_CMD = { "about.txt":"whoami", "education.log":"education", "skills.cfg":"skills", "interests.txt":"interests", "contact.vcf":"contact" };
function resolveDir(arg){
  if (!arg || arg === "~" || arg === "/" || arg === "~/" || arg === "..") return "~";
  const a = arg.replace(/\/$/, "").replace(/^~\//, "");
  if (a === ".") return cwd;
  if (FS["~/" + a]) return "~/" + a;
  return null;
}

/* ───────── renderers ───────── */
const R = {
  whoami(){
    return [
      h(`ident // ${CV.name}`),
      fgrid([
        ["handle", `<span class="mint">@${esc(CV.handle)}</span>`],
        ["role", esc(CV.role)],
        ["location", esc(CV.location)],
        ["status", `<span class="pulse"></span>online`],
      ]),
      rec({ label: "details in brief", right: "file // about.txt", body: CV.summary.map(p => `<p>${esc(p)}</p>`).join("") }),
      `<span class="d">next →</span> ${c("experience")}  ${c("projects")}  ${c("skills")}  ${c("contact")}`, "",
    ];
  },
  experience(){
    const L = [h("work history")];
    CV.experience.forEach((e, i) => L.push(rec({
      label: `record ${pad2(i + 1)} // ${esc(e.org)}${draft(e.draft)}`, right: esc(e.when), sel: i === 0,
      body: `<div class="rec-t">${esc(e.role)}</div><div class="rec-s">${esc(e.org)}</div>${ul(e.points.map(esc))}`,
    })));
    L.push("");
    return L;
  },
  projectList(){
    return [
      h("projects"),
      `<span class="d">select a file to open it</span>`,
      `<div class="opts">${CV.projects.map((p, i) =>
        `<button class="opt" data-cmd="projects ${i + 1}"><span class="rec-l"><span>file ${pad2(i + 1)} // ${esc(p.when)}</span><span>${esc(p.stack[0])}</span></span>` +
        `<span class="opt-t">${esc(p.title)}</span><span class="opt-s">${esc(p.kind)}</span></button>`).join("")}</div>`,
      `<span class="d">or</span> ${c("projects --all")} <span class="d">to open every file</span>`, "",
    ];
  },
  project(p, i){
    const list = [["stack", chips(p.stack), true]];
    if (p.url) list.push(["source", ext(p.url, p.url.replace(/^https?:\/\//, "")), true]);
    const lc = (GH.commits || []).find(x => p.url && p.url.endsWith("/" + x.repo));
    if (lc) list.push(["last commit", `<span class="mint">${esc(ago(lc.date))}</span> · ${esc(lc.msg)}`, true]);
    const nav = [];
    if (i > 0) nav.push(c(`projects ${i}`, "← prev"));
    nav.push(c("projects", "all projects"));
    if (i < CV.projects.length - 1) nav.push(c(`projects ${i + 2}`, "next →"));
    return [
      lbl(`file ${pad2(i + 1)} // projects/${esc(p.id)}.md`, "red"),
      rec({ label: `project // ${esc(p.kind)}`, right: esc(p.when), sel: true,
        body: `<div class="rec-t">${esc(p.title)}</div>${fgrid(list)}${ul(p.points.map(esc))}` }),
      nav.join("   "), "",
    ];
  },
  skills(){
    const groups = Object.entries(CV.skills);
    return [h("loadout // skills"), fgrid(groups.map(([g, l], i) => [g, chips(l), i === groups.length - 1 && groups.length % 2 === 1])), ""];
  },
  education(){
    return [h("education"), ...CV.education.map((e, i) => rec({
      label: `qualification ${pad2(i + 1)}${e.status ? " // " + esc(e.status) : ""}`, right: esc(e.when), sel: e.status === "in progress",
      body: `<div class="rec-t">${esc(e.title)}</div><div class="rec-s">${esc(e.org)}</div>`,
    })), ""];
  },
  interests(){
    return [h("offline processes"), fgrid(CV.interests.map(x => [x.title, esc(x.text)])), ""];
  },
  contact(){
    return [h("open a channel"),
      rec({ label: "contact.vcf", right: "secure line", sel: true, body: fgrid([
        ["email", ext("mailto:" + CV.email, CV.email)],
        ["github", ext(CV.links.github.url, CV.links.github.label)],
        ["linkedin", ext(CV.links.linkedin.url, CV.links.linkedin.label), true],
        ["location", esc(CV.location)],
      ]) }),
      `<span class="d">want it on paper?</span> ${c("print")} <span class="d">exports a clean PDF</span>`, ""];
  },
};

/* ───────── commands ───────── */
const COMMANDS = {

  proj:"projects", project:"projects", edu:"education", school:"education", hobbies:"interests", email:"contact", socials:"contact",
  resume:"cv", cls:"clear", dir:"ls", fetch:"neofetch", pdf:"print", crt:"scanlines", query:"sql", db:"sql", sqlite:"sql", log:"commits" };
const SQL_KEEP = new Set(["clear", "history", "help", "scanlines", "motion"]);

/* ───────── SQL mode: the CV as a SQLite database (sql.js / WebAssembly) ───────── */
const SQLJS = "https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.12.0/";
const SQL_TABLES = ["profile", "experience", "experience_points", "projects", "project_stack", "project_points", "education", "skills", "interests", "project_overview"];
const SQL_EXAMPLES = [
  "SELECT * FROM project_overview;",
  "SELECT skill FROM skills WHERE skill LIKE '%SQL%';",
  "SELECT p.title, s.tech FROM projects p JOIN project_stack s ON s.project_id = p.id WHERE s.tech LIKE 'Java%';",
  "SELECT category, COUNT(*) AS skills FROM skills GROUP BY category ORDER BY skills DESC;",
  "SELECT title, institution, status FROM education ORDER BY id;",
  "SELECT role, org FROM experience WHERE is_current = 1;",
];
const SQL_KW = ["SELECT", "FROM", "WHERE", "JOIN", "LEFT", "ON", "GROUP", "BY", "ORDER", "LIMIT", "COUNT", "DISTINCT", "LIKE", "AND", "OR", "AS", "DESC", "ASC", "HAVING", "INSERT", "INTO", "VALUES", "UPDATE", "SET", "DELETE", "group_concat"];
let db = null, dbLoading = null;

function loadScript(src){
  return new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = () => rej(new Error("network error — are you offline?")); document.head.appendChild(s); });
}
async function getDb(){
  if (db) return db;
  if (!dbLoading) dbLoading = (async () => {
    const wait = document.createElement("div"); wait.className = "ln d"; wait.textContent = "mounting cv.db …"; out.appendChild(wait); scrollEnd();
    try {
      if (!window.initSqlJs) await loadScript(SQLJS + "sql-wasm.js");
      const SQL = await initSqlJs({ locateFile: f => SQLJS + f });
      const d = new SQL.Database();
      d.run(`
        CREATE TABLE profile (key TEXT PRIMARY KEY, value TEXT NOT NULL);
        CREATE TABLE experience (id INTEGER PRIMARY KEY, org TEXT NOT NULL, role TEXT NOT NULL, period TEXT, is_current INTEGER NOT NULL DEFAULT 0);
        CREATE TABLE experience_points (experience_id INTEGER NOT NULL REFERENCES experience(id), point TEXT NOT NULL);
        CREATE TABLE projects (id INTEGER PRIMARY KEY, slug TEXT UNIQUE NOT NULL, title TEXT NOT NULL, year INTEGER, kind TEXT, url TEXT);
        CREATE TABLE project_stack (project_id INTEGER NOT NULL REFERENCES projects(id), tech TEXT NOT NULL);
        CREATE TABLE project_points (project_id INTEGER NOT NULL REFERENCES projects(id), point TEXT NOT NULL);
        CREATE TABLE education (id INTEGER PRIMARY KEY, title TEXT NOT NULL, institution TEXT, period TEXT, status TEXT);
        CREATE TABLE skills (category TEXT NOT NULL, skill TEXT NOT NULL);
        CREATE TABLE interests (title TEXT NOT NULL, detail TEXT);
        CREATE VIEW project_overview AS
          SELECT p.title, p.year, p.kind, group_concat(s.tech, ', ') AS stack
          FROM projects p LEFT JOIN project_stack s ON s.project_id = p.id
          GROUP BY p.id ORDER BY p.year DESC, p.id;
      `);
      const ins = (sql, rows) => { const st = d.prepare(sql); rows.forEach(r => st.run(r)); st.free(); };
      ins("INSERT INTO profile VALUES (?, ?)", [["name", CV.name], ["handle", "@" + CV.handle], ["role", CV.role], ["location", CV.location], ["email", CV.email], ["github", CV.links.github.url], ["linkedin", CV.links.linkedin.url]]);
      CV.experience.forEach((e, i) => {
        ins("INSERT INTO experience VALUES (?, ?, ?, ?, ?)", [[i + 1, e.org, e.role, e.when, /present/i.test(e.when) ? 1 : 0]]);
        ins("INSERT INTO experience_points VALUES (?, ?)", e.points.map(x => [i + 1, x]));
      });
      CV.projects.forEach((p, i) => {
        ins("INSERT INTO projects VALUES (?, ?, ?, ?, ?, ?)", [[i + 1, p.id, p.title, parseInt(p.when, 10) || null, p.kind, p.url || null]]);
        ins("INSERT INTO project_stack VALUES (?, ?)", p.stack.map(t => [i + 1, t]));
        ins("INSERT INTO project_points VALUES (?, ?)", p.points.map(x => [i + 1, x]));
      });
      ins("INSERT INTO education VALUES (?, ?, ?, ?, ?)", CV.education.map((e, i) => [i + 1, e.title, e.org, e.when, e.status || null]));
      ins("INSERT INTO skills VALUES (?, ?)", Object.entries(CV.skills).flatMap(([g, l]) => l.map(x => [g, x])));
      ins("INSERT INTO interests VALUES (?, ?)", CV.interests.map(x => [x.title, x.text]));
      db = d;
      return d;
    } finally { wait.remove(); dbLoading = db ? dbLoading : null; }
  })();
  return dbLoading;
}
function sqlTablesLine(){ return SQL_TABLES.map(t => c(`sql SELECT * FROM ${t};`, t)).join("  "); }
function sqlTable({ columns, values }){
  const MAX = 200, rows = values.slice(0, MAX);
  const cell = v => v === null ? `<td><span class="f">NULL</span></td>` : `<td${typeof v === "number" ? ' class="num"' : ""}>${esc(v)}</td>`;
  return `<div class="sqlwrap"><table class="sqlt"><thead><tr>${columns.map(x => `<th>${esc(x)}</th>`).join("")}</tr></thead>` +
    `<tbody>${rows.map(r => `<tr>${r.map(cell).join("")}</tr>`).join("")}</tbody></table></div>`;
}
async function runSql(q){
  const t0 = performance.now();
  let res;
  try { res = db.exec(q); }
  catch (e){ return emit([`<span class="errtag">sql error</span> <span class="err">${esc(e.message)}</span>`, ""]); }
  const ms = (performance.now() - t0).toFixed(1);
  if (!res.length){
    const n = db.getRowsModified();
    return emit([`<span class="ok">ok</span> <span class="d">· ${n} row${n === 1 ? "" : "s"} changed · ${ms} ms</span>`, ""]);
  }
  const L = [];
  res.forEach(r => {
    L.push(sqlTable(r));
    L.push(`<span class="d">${r.values.length} row${r.values.length === 1 ? "" : "s"}${r.values.length > 200 ? " (showing 200)" : ""} · ${ms} ms</span>`);
  });
  L.push("");
  await emit(L, 30);
}
async function leaveSql(){ sqlMode = false; renderPs1(); await emit([`<span class="d">left sql mode · cv.db unmounted</span>`, ""]); }
async function sqlInput(line){
  const cmd = line.toLowerCase().replace(/;$/, "");
  if ([".exit", ".quit", "exit", "quit", "\\q", "q"].includes(cmd)) return leaveSql();
  if (cmd === ".tables") return emit([sqlTablesLine(), ""]);
  if (cmd === ".examples" || cmd === ".help") return emit([lbl("try one"), ...SQL_EXAMPLES.map(x => `  ${c("sql " + x, x)}`), "", `<span class="d">dot commands:</span> ${c(".tables")}  ${c(".schema")}  ${c(".examples")}  ${c(".exit")}`, ""]);
  if (cmd.startsWith(".schema")){
    const t = line.split(/\s+/)[1];
    const r = db.exec(t ? "SELECT sql FROM sqlite_master WHERE name = ?" : "SELECT sql FROM sqlite_master WHERE sql IS NOT NULL ORDER BY type DESC, rowid", t ? [t.replace(/;$/, "")] : undefined);
    if (!r.length) return emit([`<span class="err">no such table:</span> ${esc(t)}`, ""]);
    return emit(r[0].values.map(v => `<span class="schema">${esc(v[0])};</span>`).concat(""), 12);
  }
  if (cmd.startsWith(".")) return emit([`<span class="err">unknown dot command.</span> try ${c(".examples")}`, ""]);
  return runSql(line);
}

/* ───────── live GitHub feed ───────── */
const GH_USER = "Natkiio";
const GH_REPOS = () => CV.projects.filter(p => p.url && p.url.includes(`github.com/${GH_USER}/`)).map(p => p.url.split("/").pop());
const GH = { commits: null, at: 0 };
let ghPending = null;
function ago(iso){
  const s = Math.max(0, (Date.now() - new Date(iso)) / 1000);
  if (s < 90) return "just now";
  const u = [[60, "m"], [24, "h"], [30, "d"], [12, "mo"], [Infinity, "y"]];
  let v = s / 60;
  for (const [k, l] of u){ if (v < k) return Math.floor(v) + l + " ago"; v /= k; }
}
async function ghCommits(){
  if (!GH.commits){ try { const c0 = JSON.parse(sessionStorage.getItem("nl-gh") || "null"); if (c0 && Date.now() - c0.at < 10 * 60e3) Object.assign(GH, c0); } catch {} }
  if (GH.commits) return GH.commits;
  if (!ghPending) ghPending = (async () => {
    const lists = await Promise.all(GH_REPOS().map(async repo => {
      const r = await fetch(`https://api.github.com/repos/${GH_USER}/${repo}/commits?per_page=10`, { headers: { Accept: "application/vnd.github+json" } });
      if (!r.ok) throw new Error(r.status === 403 || r.status === 429 ? "GitHub rate limit hit — try again in a bit" : `GitHub returned ${r.status}`);
      return (await r.json()).map(x => ({ repo, sha: x.sha, msg: x.commit.message.split("\n")[0], date: x.commit.committer.date, url: x.html_url }));
    }));
    GH.commits = lists.flat().sort((a, b) => b.date.localeCompare(a.date));
    GH.at = Date.now();
    try { sessionStorage.setItem("nl-gh", JSON.stringify(GH)); } catch {}
    return GH.commits;
  })().finally(() => { ghPending = null; });
  return ghPending;
}

    `<pre class="banner lg" aria-label="${esc(CV.name)}">${$("#banner-lg").innerHTML}</pre>` +
    `<pre class="banner sm" aria-hidden="true">${$("#banner-sm").innerHTML}</pre>` +
    `<div class="banner-txt glitch" data-text="${esc(CV.name)}">${esc(CV.name)}</div>` +
    `<span class="segbar"></span>`,
    `<span class="tagline"><span class="red">${esc(CV.role)}</span>  <span class="f">/</span>  <span class="m">${esc(CV.location)}</span></span>`,
    "",
    `welcome to my CV. it's a terminal — type ${c("help")}, or click anything <span class="red">red</span>.`,
    `<span class="d">in a hurry?</span> ${c("cv")} <span class="d">opens the full record ·</span> ${c("print")} <span class="d">gives you a PDF</span>`,
    `<span class="d">database engineer, so naturally this CV is a database →</span> ${c("sql")} <span class="d">· live commits →</span> ${c("git log")}`,
    "",
  ], 70);
  if (!quick) await autoType("whoami");
}
async function autoType(text){
  if (!motion) return run(text);
  input.value = "";
  for (const ch of text){ if (flushing) break; input.value += ch; await new Promise(r => setTimeout(r, 85)); }
  await new Promise(r => setTimeout(r, 220));
  input.value = "";
  await run(text);
}

/* ───────── input ───────── */
function completions(val){
  if (sqlMode){
    const m = val.match(/^(.*?)([\w.]*)$/s), head = m[1], word = m[2];
    if (!word) return [];
    const pool = [...SQL_TABLES, ...SQL_KW, ".tables", ".schema", ".examples", ".exit"];
    return pool.filter(o => o.toLowerCase().startsWith(word.toLowerCase())).map(o => head + o);
  }
  const parts = val.split(/\s+/);
  if (parts.length <= 1) return Object.keys(COMMANDS).filter(k => !COMMANDS[k].hidden && k.startsWith(parts[0]));
  const [cmd, arg = ""] = parts;
  let pool = [];
  if (cmd === "cat"){
    const here = FS[cwd].filter(f => !f.endsWith("/"));
    pool = cwd === "~" ? [...here, ...FS["~/projects"].map(f => "projects/" + f)] : here;
  }
  if (cmd === "cd" || cmd === "ls") pool = cwd === "~" ? ["projects", "experience"] : ["~", ".."];
  if (cmd === "open") pool = ["github", "linkedin", "email", ...CV.projects.filter(p => p.url).map(p => p.id)];
  if (cmd === "motion" || cmd === "scanlines") pool = ["on", "off"];
  if (cmd === "projects") pool = ["--all", ...CV.projects.map(p => p.id)];
  if (cmd === "git") pool = parts.length === 2 ? ["log", "status"] : [];
  if (cmd === "git" && parts[1] === "log" && parts.length === 3){ return GH_REPOS().filter(r => r.startsWith(parts[2])).map(r => `git log ${r}`); }
  return pool.filter(o => o.startsWith(arg)).map(o => `${cmd} ${o}`);
}

input.addEventListener("keydown", e => {
  if (e.key === "Enter"){
    e.preventDefault();
    if (busy){ flushing = true; return; }
    const v = input.value; input.value = ""; exec(v);
  } else if (e.key === "ArrowUp"){
    e.preventDefault(); if (hIdx > 0){ hIdx--; input.value = hist[hIdx]; }
  } else if (e.key === "ArrowDown"){
    e.preventDefault(); if (hIdx < hist.length - 1){ hIdx++; input.value = hist[hIdx]; } else { hIdx = hist.length; input.value = ""; }
  } else if (e.key === "Tab"){
    e.preventDefault();
    const opts = completions(input.value);
    if (opts.length === 1) input.value = opts[0] + (opts[0].includes(" ") ? "" : " ");
    else if (opts.length > 1){
      const common = opts.reduce((a, b) => { let i = 0; while (i < a.length && a[i] === b[i]) i++; return a.slice(0, i); });
      if (common.length > input.value.length) input.value = common;
      else { echoLine(input.value); emit([opts.map(o => c(o, o.split(" ").pop())).join("   "), ""], 0); }
    }
  } else if (e.key === "l" && e.ctrlKey){
    e.preventDefault(); out.innerHTML = "";
  } else if (e.key === "c" && e.ctrlKey && !window.getSelection().toString()){
    e.preventDefault(); echoLine(input.value + "^C"); input.value = ""; flushing = true;
  } else if (e.key === "Escape"){
    flushing = true;
  }
});
document.addEventListener("keydown", e => { if (busy && e.key === "Escape") flushing = true; });

document.addEventListener("click", e => {
  const b = e.target.closest("[data-cmd]");
  if (b){ e.preventDefault(); if (busy) flushing = true; exec(b.dataset.cmd); if (finePointer) input.focus({ preventScroll: true }); return; }
  if (e.target.closest("a")) return;
  if (e.target.closest("#term") && finePointer && !window.getSelection().toString()) input.focus({ preventScroll: true });
});
term.addEventListener("pointerdown", () => { if (busy) flushing = true; }, { passive: true });

/* ───────── clocks ───────── */
function fmtDur(ms){ const s = Math.floor(ms / 1000); return [s / 3600, (s % 3600) / 60, s % 60].map(x => String(Math.floor(x)).padStart(2, "0")).join(":"); }
const tfmt = new Intl.DateTimeFormat("en-IE", { timeZone: "Europe/Dublin", hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false });
function tickClock(){
  const t = tfmt.format(new Date());
  $("#sysTime").textContent = t; $("#clock").textContent = t + " IE";
  $("#uptime").textContent = "session " + fmtDur(Date.now() - started);
}
